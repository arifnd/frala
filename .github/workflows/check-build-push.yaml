name: Check, Build, and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Test scenario tags'
        required: false
        type: boolean

#   schedule:
#     - cron: '0 3 * * *'   # Runs daily at 3 AM UTC

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Restore digests file if exists
        id: restore-digests
        uses: actions/download-artifact@v3
        with:
          name: digests
          path: .

      - name: Run build script
        run: |
          chmod +x ./check_build_push.sh
          ./check_build_push.sh
        env:
          IMAGE: ${{ env.IMAGE }}

      - name: Upload updated digests file
        uses: actions/upload-artifact@v3
        with:
          name: digests
          path: digests.txt

      - name: Commit and push digest updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet digests.txt; then
            echo "No changes in digests.txt, skipping commit."
          else
            git add digests.txt
            git commit -m "Update digests.txt [skip ci]"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN || secrets.GITHUB_TOKEN }}
