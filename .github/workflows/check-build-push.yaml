name: Check, Build, and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to process ("all" for all tags)'
        required: true
        default: 'all'
        type: string

#   schedule:
#     - cron: '0 3 * * 3'   # Runs every Wednesday at 10:00 UTC+7 (03:00 UTC)
#
# Note: schedule events carry no inputs, so TARGET_TAG resolves to empty and the
# `|| 'all'` default below makes the run process every tag in tags.txt.

# Serialize runs so only one job can mutate digests.txt at a time. Prevents a
# scheduled run and a manual workflow_dispatch from racing on the push.
concurrency:
  group: check-build-push
  cancel-in-progress: false

jobs:
  # Decide which tags changed and emit the native build matrix.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_tags: ${{ steps.plan.outputs.has_tags }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Plan builds
        id: plan
        run: |
          chmod +x ./ci_multiarch.sh
          ./ci_multiarch.sh plan
        env:
          IMAGE: arifnd/frala
          BASE_IMAGE: dunglas/frankenphp
          TARGET_TAG: ${{ github.event.inputs.tag || 'all' }}

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan.tsv
          if-no-files-found: error
          retention-days: 1

  # Build each changed tag on a native runner (amd64 and arm64 in parallel).
  build:
    needs: plan
    if: needs.plan.outputs.has_tags == 'true'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build ${{ matrix.tag }} (${{ matrix.arch }})
        run: |
          chmod +x ./ci_multiarch.sh
          ./ci_multiarch.sh build "${{ matrix.tag }}" "${{ matrix.platform }}"
        env:
          IMAGE: arifnd/frala
          BASE_IMAGE: dunglas/frankenphp

  # Assemble multi-arch manifests, apply aliases, and update digests.txt.
  merge:
    needs: [plan, build]
    if: always() && needs.plan.outputs.has_tags == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: plan

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge manifests
        run: |
          chmod +x ./ci_multiarch.sh
          ./ci_multiarch.sh merge
        env:
          IMAGE: arifnd/frala
          BASE_IMAGE: dunglas/frankenphp
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Commit and push digest updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet digests.txt; then
            echo "No changes in digests.txt, skipping commit."
          else
            git add digests.txt
            git commit -m "Update digests.txt [skip ci]"
            git pull --rebase --autostash
            git push
          fi
