name: Check, Build, and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to process ("all" for all tags)'
        required: true
        default: 'all'
        type: string

#   schedule:
#     - cron: '0 3 * * 3'   # Runs every Wednesday at 10:00 UTC+7 (03:00 UTC)
#
# Note: schedule events carry no inputs, so TARGET_TAG resolves to empty and the
# `|| 'all'` default below makes the run process every tag in tags.txt.

# Serialize runs so only one job can mutate digests.txt at a time. Prevents a
# scheduled run and a manual workflow_dispatch from racing on the push.
concurrency:
  group: check-build-push
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest

    permissions:
      contents: write 

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run build script
        run: |
          chmod +x ./check_build_push.sh
          ./check_build_push.sh
        env:
          IMAGE: arifnd/frala
          PLATFORMS: linux/amd64,linux/arm64
          TARGET_TAG: ${{ github.event.inputs.tag || 'all' }}

      - name: Commit and push digest updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet digests.txt; then
            echo "No changes in digests.txt, skipping commit."
          else
            git add digests.txt
            git commit -m "Update digests.txt [skip ci]"
            git pull --rebase --autostash
            git push
          fi
